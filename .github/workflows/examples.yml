name: Examples

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "examples/**"
      - "content/patterns/**"
      - "scripts/sync-examples.js"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pytest
        run: pip install "pytest>=8"

      - name: Run every example's tests
        working-directory: examples
        run: pytest

  in-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Pattern pages show the tested code
        run: node scripts/sync-examples.js --check
